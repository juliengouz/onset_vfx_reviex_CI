<title>CI Relevé VFX</title>
<style>
:root{
  --bg:#0b1016; --bg2:#121a23; --card:#16202b; --line:#253344; --ink:#e8f0f8; --mute:#8fa3b8;
  --acc:#3fa9ff; --acc2:#7fd0ff; --ok:#3ecf8e; --warn:#ffb547; --bad:#ff6b6b; --circ:#ff4d6d;
  --r:12px; --tap:46px;
}
:root[data-theme="light"]{
  --bg:#f3f6f9; --bg2:#ffffff; --card:#ffffff; --line:#d3dde7; --ink:#0d1620; --mute:#55677a;
  --acc:#0a72d1; --acc2:#0a5fae; --ok:#14935a; --warn:#b26a00; --bad:#c62f2f; --circ:#d4163c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top img{height:40px;width:auto;display:block;background:#0b1016;border-radius:8px;padding:3px 6px}
.sess{flex:1;min-width:160px}
.sess .film{font-weight:700;font-size:18px;letter-spacing:.02em}
.sess .meta{font-size:12px;color:var(--mute)}
.save{font-size:12px;color:var(--mute);white-space:nowrap}
.save.err{color:var(--bad);font-weight:700}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:980px;margin:0 auto;padding:12px}
.btn{min-height:var(--tap);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
h2{font-size:20px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
details.card>summary{list-style:none;cursor:pointer;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:before{content:"▸";color:var(--acc);transition:transform .15s}
details.card[open]>summary:before{transform:rotate(90deg)}
.sumhint{margin-left:auto;font-weight:400;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input[type=time],select,textarea{min-height:var(--tap);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tog{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;user-select:none;-webkit-user-select:none}
.tog .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tog.on{border-color:var(--ok)}
.tog.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.notesbtn{margin-top:10px}
.notesbox{margin-top:8px}
.notesbox textarea{border-style:dashed;min-height:80px}
.list .shot{display:flex;align-items:center;gap:12px;cursor:pointer}
.shotnum{font-size:22px;font-weight:800;min-width:72px;color:var(--acc2)}
.shotinfo{flex:1;min-width:0}
.shotinfo .t{font-weight:700}
.shotinfo .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.st-a_tourner{color:var(--mute)} .st-en_cours{color:var(--warn)} .st-fait{color:var(--ok)} .st-a_refaire{color:var(--bad)}
.circ{color:var(--circ);font-weight:800}
.pass{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.passhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.passhead .n{font-weight:800;color:var(--acc2);min-width:36px}
.passhead input{flex:1;min-width:140px}
.take{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.take:first-of-type{border-top:none}
.take .tn{font-weight:700;min-width:70px}
.take .tt{flex:1;font-size:13px;color:var(--mute)}
.cbtn{min-height:40px;min-width:40px;border-radius:20px;border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:800;padding:0 10px}
.cbtn.on{border-color:var(--circ);background:var(--circ);color:#fff}
.bigcirc{min-height:54px;font-size:18px}
.crumb{color:var(--mute);font-size:14px;margin:4px 0}
.title{font-size:22px;font-weight:800;margin:4px 0}
.stamp{font-size:13px;color:var(--mute)}
.meas{display:flex;gap:6px;margin:6px 0}
.meas input:first-child{flex:2} .meas input:nth-child(2){flex:1}
.bar{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:15}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:20px 12px;overflow:auto}
.modal .box2{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;margin-top:40px}
.modal h3{margin:0 0 8px}
.modal p{color:var(--mute);margin:6px 0 12px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.filters{margin:6px 0 4px}
.warnbar{background:var(--bad);color:#fff;padding:8px 12px;font-weight:600;font-size:14px}
.ver{font-size:11px;color:var(--mute);text-align:center;margin:20px 0}
.besoins{margin:8px 0 2px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg2)}
.beshead{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.besred{color:var(--bad);font-weight:800}
.besok{color:var(--ok);font-weight:700}
.bes{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.cbox{min-width:30px;height:30px;border-radius:7px;border:2px solid var(--mute);background:transparent;cursor:pointer;font-weight:900;color:#fff;flex:none}
.cbox.on{background:var(--ok);border-color:var(--ok)}
.beslbl{flex:1;min-width:120px;font-size:14px}
.beslbl.done{color:var(--mute);text-decoration:line-through}
.besd{flex:1;min-width:120px;min-height:34px!important;padding:4px 8px!important}
@media (max-width:520px){
  header.top img{height:32px}
  .sess .film{font-size:16px}
  .grid{grid-template-columns:1fr 1fr}
  .shotnum{min-width:56px;font-size:19px}
  .hbtns .btn{padding:6px 10px;font-size:14px}

/* ---------- utilitaires ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function nowISO(){return new Date().toISOString();}
function fmtDT(iso){if(!iso)return "";var d=new Date(iso);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtT(iso){if(!iso)return "";var d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());}
function hhmm(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function slug(s){return String(s||"x").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";}
function stamp(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+"h"+pad(d.getMinutes())+"m"+pad(d.getSeconds());}
function clone(o){return JSON.parse(JSON.stringify(o));}
function planKey(s){var a=parseFloat(s.seq)||0,b=String(s.plan||"");var m=b.match(/(\d+)\s*([A-Za-z]*)/);return [a,m?parseInt(m[1],10):999,m?m[2]:b];}
function cmpShot(x,y){var a=planKey(x),b=planKey(y);for(var i=0;i<3;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1;}return 0;}

function defaultTakeData(){
  var d={};

      else o[f.k]=f.d||"";
    });
    if(!s.noNotes)o.notes="";
    d[s.key]=o;
  });
  return d;
}

  return sh;
}

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);}}catch(e){storageOK=false;}
  if(!S){S=demoProject();}
  migrate();
}
function migrate(){
  if(!S.shots)S.shots=[];
  S.shots.forEach(function(sh){
    if(!sh.passes||!sh.passes.length)sh.passes=[{id:uid(),num:1,name:"Principale"}];
    if(sh.rackFocus===undefined)sh.rackFocus=false;
    sh.passes.forEach(function(pz){if(!pz.besoins)pz.besoins=[];});
    sh.takes=sh.takes||[];
    sh.takes.forEach(function(t){var def=defaultTakeData();
      for(var k in def){if(!t.d[k])t.d[k]=def[k];else for(var f in def[k])if(!(f in t.d[k]))t.d[k][f]=def[k][f];}});
  });
}
function save(now){
  clearTimeout(saveTimer);
  var go=function(){
    try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;setSave("● Enregistré "+hhmm());}
    catch(e){storageOK=false;setSave("⚠ Sauvegarde impossible — exportez !",true);}
    renderWarn();
  };
  if(now)go();else{setSave("…");saveTimer=setTimeout(go,400);}
}
function setSave(t,err){var el=document.getElementById("save");el.textContent=t;el.className="save"+(err?" err":"");}
function renderWarn(){
  document.getElementById("warn").innerHTML=storageOK?"":'<div class="warnbar">Le stockage local ne fonctionne pas sur cet appareil/navigateur. Les données seront perdues à la fermeture : exportez une sauvegarde (.json) régulièrement.</div>';
}
function applyTheme(){
  var t=S.theme||"auto",r=document.documentElement;
  if(t==="auto"){var l=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches;r.setAttribute("data-theme",l?"light":"dark");}
  else r.setAttribute("data-theme",t);
}

function getShot(id){for(var i=0;i<S.shots.length;i++)if(S.shots[i].id===id)return S.shots[i];return null;}
function getTake(sh,id){for(var i=0;i<sh.takes.length;i++)if(sh.takes[i].id===id)return sh.takes[i];return null;}
function getPass(sh,id){for(var i=0;i<sh.passes.length;i++)if(sh.passes[i].id===id)return sh.passes[i];return null;}
function takesOf(sh,pid){return sh.takes.filter(function(t){return t.passId===pid;}).sort(function(a,b){return a.num-b.num;});}
function touch(sh){sh.updatedAt=nowISO();}

function newTake(sh,pid){
  var list=takesOf(sh,pid),src=null;
  if(list.length)src=list[list.length-1];
  else if(sh.takes.length){src=sh.takes.slice().sort(function(a,b){return a.createdAt<b.createdAt?-1:1;}).pop();}
  var d=src?clone(src.d):defaultTakeData();
  if(src){SECTIONS.forEach(function(s){if(d[s.key]&&"notes" in d[s.key])d[s.key].notes="";});d.gen.txt="";}
  var t={id:uid(),passId:pid,num:list.length?list[list.length-1].num+1:1,createdAt:nowISO(),circled:false,d:d};
  sh.takes.push(t);
  if(sh.status==="a_tourner")sh.status="en_cours";
  touch(sh);save();
  return t;
}

function sumHint(s,o){
  var on=[];s.fields.forEach(function(f){if(f.t==="bool"&&o[f.k])on.push(f.l.split(" ")[0]);});
  if(s.key==="cam")return esc([o.focale?o.focale+"mm":"",o.tstop?"T"+o.tstop:"",o.shutter?o.shutter+"°":""].filter(Boolean).join(" · "));
  if(s.key==="scan")return esc(o.type);
  if(s.key==="mes")return (o.list||[]).filter(function(m){return m.v;}).length+" mesure(s)";
  return on.length?"✓ "+esc(on.join(", ")):"";

  if(f.t==="measures"){
    var h=(v||[]).map(function(m,i){return '<div class="meas"><input type="text" placeholder="Quoi" data-b="m:'+sk+'.'+f.k+'.'+i+'.l" value="'+esc(m.l)+'"><input type="text" placeholder="Valeur" data-b="m:'+sk+'.'+f.k+'.'+i+'.v" value="'+esc(m.v)+'"><button class="btn sm bad" data-act="delMeas" data-i="'+i+'">✕</button></div>';}).join("");
    return fld(f.l,h+'<div><button class="btn sm" data-act="addMeas">+ Mesure</button></div>',1);
  }
  var type=f.t==="num"?'text" inputmode="decimal':(f.t==="time"?"time":"text");
  var inp='<input type="'+type+'" data-b="'+b+'" value="'+esc(v)+'">';
  if(f.quick)inp+='<div class="chips" style="margin-top:4px">'+f.quick.map(function(q){return '<button class="chip" data-act="quick" data-b="'+b+'" data-v="'+q+'">'+q+'</button>';}).join("")+'</div>';
  if(f.now)inp+='<div style="margin-top:4px"><button class="chip" data-act="quick" data-b="'+b+'" data-v="__now">Maintenant</button></div>';
  return fld(f.l,inp,f.w);
}

/* ---------- rendu global ---------- */
function render(keepScroll){
  var y=window.scrollY;
  renderHeader();
  var app=document.getElementById("app"),sh=ui.shot?getShot(ui.shot):null,t=sh&&ui.take?getTake(sh,ui.take):null;
  if(ui.view==="take"&&t)app.innerHTML=renderTake(sh,t);
  else if(ui.view!=="list"&&sh){ui.view="shot";app.innerHTML=renderShot(sh);}
  else {ui.view="list";app.innerHTML=renderList();}
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function go(view,shot,take){ui.view=view;ui.shot=shot||null;ui.take=take||null;render(false);}

/* ---------- liaison des champs ---------- */
function setBind(b,val){
  var sh=getShot(ui.shot),parts;
  if(b.indexOf("s:")===0){sh[b.slice(2)]=val;touch(sh);}
  else if(b.indexOf("b:")===0){parts=b.split(":");var pb=getPass(sh,parts[1]);if(pb&&pb.besoins&&pb.besoins[+parts[2]])pb.besoins[+parts[2]].d=val;touch(sh);}
  else if(b.indexOf("p:")===0){parts=b.split(":");var p=getPass(sh,parts[1]);if(p)p[parts[2]]=val;touch(sh);}
  else if(b.indexOf("t:")===0){var t=getTake(sh,ui.take);parts=b.slice(2).split(".");t.d[parts[0]][parts[1]]=val;touch(sh);}
  else if(b.indexOf("m:")===0){var t2=getTake(sh,ui.take);parts=b.slice(2).split(".");t2.d[parts[0]][parts[1]][+parts[2]][parts[3]]=val;touch(sh);}
  save();
}
function getBind(b){
  var sh=getShot(ui.shot);
  if(b.indexOf("t:")===0){var t=getTake(sh,ui.take),p=b.slice(2).split(".");return t.d[p[0]][p[1]];}
  return null;
}
document.addEventListener("input",function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute("data-b");if(!b)return;
  setBind(b,el.value);
});
document.addEventListener("change",function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute("data-b");if(!b)return;
  setBind(b,el.value);
  if(el.getAttribute("data-rerender"))render(true);
});

/* ---------- actions ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),v=el.getAttribute("data-v"),b=el.getAttribute("data-b");
  if(el.tagName==="A")e.preventDefault();
  var sh=ui.shot?getShot(ui.shot):null;
  switch(a){
    case "back":go("list");break;
    case "filter":ui.filter=v;render(true);break;
    case "openShot":go("shot",id);break;
    case "newShot":modalNewShot();break;
    case "status":sh.status=v;touch(sh);save();render(true);break;
    case "validate":sh.status="fait";touch(sh);save(true);go("list");break;
    case "delShot":confirmBox("Supprimer le plan "+sh.seq+"/"+sh.plan+" ?","Toutes ses prises seront effacées.","Supprimer",function(){S.shots=S.shots.filter(function(x){return x.id!==sh.id;});save(true);go("list");});break;
    case "multiTake":sh.multiTake=!sh.multiTake;touch(sh);save();render(true);break;
    case "rackFocus":
      sh.rackFocus=!sh.rackFocus;
      if(sh.rackFocus)sh.passes.forEach(function(p){if(!p.besoins)p.besoins=[];if(!p.besoins.some(function(x){return x.k==="focus";}))p.besoins.push(mkBesoin("focus"));});
      else sh.passes.forEach(function(p){p.besoins=(p.besoins||[]).filter(function(x){return x.k!=="focus";});});
      touch(sh);save();render(true);break;
    case "besCov":var pBc=getPass(sh,el.getAttribute("data-pid")),bic=+el.getAttribute("data-i");if(pBc&&pBc.besoins[bic]){pBc.besoins[bic].c=!pBc.besoins[bic].c;touch(sh);save();render(true);}break;
    case "delBes":var pBd=getPass(sh,el.getAttribute("data-pid")),bid=+el.getAttribute("data-i");if(pBd&&pBd.besoins){pBd.besoins.splice(bid,1);touch(sh);save();render(true);}break;
    case "addBes":modalAddBesoin(sh,el.getAttribute("data-pid"));break;
    case "addPass":var n=sh.passes.reduce(function(m,p){return Math.max(m,p.num);},0)+1;sh.passes.push({id:uid(),num:n,name:"Passe "+n});touch(sh);save();render(true);break;
    case "delPass":
      if(sh.passes.length<=1){alertBox("Un plan doit garder au moins une passe.");break;}
      var nt=takesOf(sh,id).length;
      confirmBox("Supprimer cette passe ?",nt?nt+" prise(s) liée(s) seront effacées.":"","Supprimer",function(){
        sh.passes=sh.passes.filter(function(p){return p.id!==id;});sh.takes=sh.takes.filter(function(t){return t.passId!==id;});
        sh.passes.sort(function(x,y){return x.num-y.num;}).forEach(function(p,i){p.num=i+1;});touch(sh);save();render(true);});break;
    case "addTake":var t=newTake(sh,id);go("take",sh.id,t.id);break;
    case "openPass":var l=takesOf(sh,id);var tk=l.length?l[l.length-1]:newTake(sh,id);go("take",sh.id,tk.id);break;
    case "openTake":go("take",sh.id,id);break;
    case "delTake":confirmBox("Supprimer cette prise ?","","Supprimer",function(){sh.takes=sh.takes.filter(function(x){return x.id!==id;});touch(sh);save();go("shot",sh.id);});break;
    case "circle":var tc=getTake(sh,id);tc.circled=!tc.circled;touch(sh);save();render(true);break;
    case "bool":var cur=getBind(b);setBind(b,!cur);el.classList.toggle("on",!cur);el.querySelector(".box").textContent=!cur?"✓":"";break;
    case "single":var c2=getBind(b);var nv=c2===v?"":v;setBind(b,nv);
      var sib=el.parentNode.children;for(var i=0;i<sib.length;i++)sib[i].classList.toggle("on",sib[i].getAttribute("data-v")===nv);break;
    case "multi":var arr=(getBind(b)||[]).slice();var ix=arr.indexOf(v);if(ix>=0)arr.splice(ix,1);else arr.push(v);setBind(b,arr);el.classList.toggle("on",ix<0);break;
    case "quick":var val=v==="__now"?hhmm():v;setBind(b,val);var inp=el.closest(".f").querySelector("input");if(inp)inp.value=val;break;
    case "addMeas":var tm=getTake(sh,ui.take);tm.d.mes.list.push({l:"",v:""});touch(sh);save();render(true);break;
    case "delMeas":var td=getTake(sh,ui.take);td.d.mes.list.splice(+el.getAttribute("data-i"),1);touch(sh);save();render(true);break;
    case "toggleNotes":var bx=el.parentNode.nextElementSibling;bx.style.display=bx.style.display==="none"?"":"none";if(bx.style.display==="")bx.querySelector("textarea").focus();break;
    case "export":modalExport();break;
    case "menu":modalMenu();break;
  }
});

/* ---------- exports ---------- */
function shotType(s){return s.vfxType==="Autre"?(s.vfxOther||"Autre"):(s.vfxType||"");}
function fmtVal(f,v){
  if(f.t==="bool")return v?"oui":"non";
  if(f.t==="multi")return (v||[]).join(", ");
  if(f.t==="measures")return (v||[]).filter(function(m){return m.l||m.v;}).map(function(m){return m.l+" = "+m.v;}).join(" | ");
  return v==null?"":String(v);
}
function buildTXT(){
  var p=S.project,L=[];
  L.push("RELEVÉ VFX — "+p.name.toUpperCase());
  L.push((p.prod?p.prod+" · ":"")+(p.real?"réal. "+p.real+" · ":"")+"Appareil : "+S.device+(S.operator?" · "+S.operator:""));
  L.push("Export : "+fmtDT(nowISO())+" · CI Relevé VFX v"+APP_VERSION);
  L.push("");
  S.shots.slice().sort(cmpShot).forEach(function(sh){
    L.push("════════════════════════════════════════");
    L.push("PLAN "+sh.seq+"/"+sh.plan+" — "+shotType(sh)+" — "+stLabel(sh.status).toUpperCase());
    if(sh.cadre)L.push("Cadre : "+sh.cadre);
    if(sh.vfxDesc)L.push("VFX : "+sh.vfxDesc);
    if(sh.notes)L.push("Notes plan : "+sh.notes);
    var circ=sh.takes.filter(function(t){return t.circled;}).sort(function(a,b){var pa=getPass(sh,a.passId),pb=getPass(sh,b.passId);return ((pa?pa.num:0)-(pb?pb.num:0))||(a.num-b.num);});
    if(circ.length)L.push("Cerclées : "+circ.map(function(t){var ps=getPass(sh,t.passId);return "P"+(ps?ps.num:"?")+(sh.multiTake?"-T"+t.num:"");}).join(", "));
    sh.passes.slice().sort(function(a,b){return a.num-b.num;}).forEach(function(ps){
      var list=takesOf(sh,ps.id);
      L.push("");L.push("  ── Passe P"+ps.num+" : "+ps.name+(list.length?"":" (aucun relevé)"));
      if(ps.besoins&&ps.besoins.length){
        var cov=ps.besoins.filter(function(b){return b.c;}).map(besTxt),non=ps.besoins.filter(function(b){return !b.c;}).map(besTxt);
        L.push("     Besoins — couverts : "+(cov.join(", ")||"—"));
        if(non.length)L.push("     Besoins — NON COUVERTS : "+non.join(", "));
      }
      list.forEach(function(t){
        L.push("   ▸ "+(sh.multiTake?"Prise "+t.num:"Relevé")+(t.circled?" ◯ CERCLÉE":"")+" — "+fmtDT(t.createdAt));
        SECTIONS.forEach(function(s){
          var o=t.d[s.key],parts=[];
          s.fields.forEach(function(f){var x=fmtVal(f,o[f.k]);if(x&&!(f.t==="bool"&&!o[f.k])&&!(s.key==="scan"&&f.k==="type"&&x==="Aucun"))parts.push(f.l+" : "+x);});
          if(o.notes)parts.push("Notes : "+o.notes);
          if(parts.length)L.push("     ["+s.title+"] "+parts.join(" · "));
        });
      });
    });
    L.push("");
  });
  return L.join("\n");
}
function csvCell(v){v=v==null?"":String(v).replace(/\r?\n/g," ⏎ ");return /[;"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
  var head=["Film","Appareil","Export","Séq","Plan","Plan ID","Cadre","Type VFX","Statut","Description VFX","Notes plan","Passe n°","Passe","Prise","Cerclée","Horodatage prise"];
  SECTIONS.forEach(function(s){s.fields.forEach(function(f){head.push(s.title+" — "+f.l);});if(!s.noNotes)head.push(s.title+" — Notes");});
  head.push("Besoins couverts (passe)","Besoins NON couverts (passe)");
  var rows=[head],ex=fmtDT(nowISO());
  S.shots.slice().sort(cmpShot).forEach(function(sh){
    var base=[S.project.name,S.device,ex,sh.seq,sh.plan,sh.seq+"/"+sh.plan,sh.cadre,shotType(sh),stLabel(sh.status),sh.vfxDesc,sh.notes];
    var any=false;
    sh.passes.slice().sort(function(a,b){return a.num-b.num;}).forEach(function(ps){
      takesOf(sh,ps.id).forEach(function(t){
        any=true;
        var r=base.concat([ps.num,ps.name,t.num,t.circled?"oui":"non",fmtDT(t.createdAt)]);
        SECTIONS.forEach(function(s){var o=t.d[s.key];s.fields.forEach(function(f){r.push(fmtVal(f,o[f.k]));});if(!s.noNotes)r.push(o.notes||"");});
        var bcov=(ps.besoins||[]).filter(function(b){return b.c;}).map(besTxt).join(" | "),bnon=(ps.besoins||[]).filter(function(b){return !b.c;}).map(besTxt).join(" | ");
        r.push(bcov,bnon);
        rows.push(r);
      });
    });
    if(!any)rows.push(base);
  });
  return "﻿"+rows.map(function(r){return r.map(csvCell).join(";");}).join("\r\n");
}
function fileName(ext){return slug(S.project.name)+"_"+slug(S.device)+"_"+stamp()+"."+ext;}
function payload(kind){
  if(kind==="txt")return {name:fileName("txt"),type:"text/plain;charset=utf-8",data:buildTXT()};
  if(kind==="csv")return {name:fileName("csv"),type:"text/csv;charset=utf-8",data:buildCSV()};
  var o=clone(S);o.exportedAt=nowISO();o.exportedFrom=S.device;
  return {name:fileName("json"),type:"application/json",data:JSON.stringify(o,null,1)};
}
function doExport(kind,after){
  var p=payload(kind);
  openModal('<h3>Export '+kind.toUpperCase()+'</h3><p>'+esc(p.name)+'</p>'+
    '<div class="row"><button class="btn pri" id="eShare">Partager / AirDrop</button><button class="btn" id="eDl">Télécharger</button><button class="btn" id="eShow">Afficher pour copier</button></div>'+
    '<div id="eBox"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="eDone">'+(after?"Continuer ›":"Fermer")+'</button></div>');
  var blob=new Blob([p.data],{type:p.type});
  var file=null;try{file=new File([blob],p.name,{type:p.type});}catch(e){}
  bindModal({
    eShare:function(){
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});}
      else if(navigator.share){navigator.share({title:p.name,text:p.data}).catch(function(){});}
      else msg("Partage non disponible ici : utilisez Télécharger ou Copier.");
    },
    eDl:function(){
      try{var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=p.name;document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(u);a.remove();},3000);}catch(e){msg("Téléchargement impossible : utilisez Copier.");}
    },
    eShow:function(){
      document.getElementById("eBox").innerHTML='<textarea id="eTa" style="min-height:220px;margin-top:10px;font-size:12px;font-family:Menlo,monospace">'+esc(p.data)+'</textarea><div class="row" style="margin-top:6px"><button class="btn sm" id="eCopy">Copier tout</button></div>';
      document.getElementById("eCopy").onclick=function(){var ta=document.getElementById("eTa");ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
        var ok=false;try{ok=document.execCommand("copy");}catch(x){}
        if(navigator.clipboard&&!ok)navigator.clipboard.writeText(p.data).then(function(){msg("Copié.");},function(){msg("Sélectionné : faites Copier.");});else msg(ok?"Copié.":"Sélectionné : faites Copier.");};
    },
    eDone:function(){closeModal();if(after)after();}
  });
  function msg(t){var b=document.getElementById("eBox");if(b)b.insertAdjacentHTML("beforeend",'<p>'+esc(t)+'</p>');}
}
function modalExport(){
  openModal('<h3>Exporter « '+esc(S.project.name)+' »</h3><p>Nom des fichiers : film_appareil_date_heure. Le .json est la sauvegarde complète (réouvrable sur un autre appareil).</p>'+
    '<div class="row"><button class="btn pri" id="x1">Texte lisible (.txt)</button><button class="btn pri" id="x2">Tableur (.csv)</button><button class="btn" id="x3">Sauvegarde projet (.json)</button></div>'+
    '<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="mNo">Fermer</button></div>');
  bindModal({mNo:closeModal,x1:function(){doExport("txt");},x2:function(){doExport("csv");},x3:function(){doExport("json");}});
}

if(window.matchMedia)try{window.matchMedia("(prefers-color-scheme: light)").addEventListener("change",applyTheme);}catch(e){}
window.addEventListener("pagehide",function(){save(true);});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
})();
